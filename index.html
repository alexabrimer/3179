<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>
<script src="vega_lite_vis.js"></script>
<title>AFL Player Statistics</title>
<link rel="stylesheet" href="https://unpkg.com/purecss@2.0.6/build/pure-min.css" integrity="sha384-Uu6IeWbM+gzNVXJcM9XV3SohHtmWE+3VGi496jvgX1jyvDTXfdK+rfZc8C1Aehk5" crossorigin="anonymous">
<link rel="stylesheet" href="https://unpkg.com/purecss@2.0.6/build/grids-responsive-min.css" />
<link rel="stylesheet" href="style.css">
</head>
</head>
<body>

  <header class="page-header">
    <h1>Brownlow top ten</h1>
  </header>

  <main class="content">
    <div class="pure-g">

        <div class="pure-u-1">
            <h2>Flow Map</h2>
            <div id="flowmap" class="chart"></div>
        </div>

        <div class="pure-u-1">
            <h2>Radar: normalised stats</h2>
            <div id="radar" class="chart"></div>
        </div>

        <div class="pure-u-1">
            <h2>Butterfly: head to head</h2>
            <div id="butterfly" class="chart"></div>
        </div>

        <div class="pure-u-1">
            <h2>Bump: rank by running total</h2>
            <div id="bump" class="chart"></div>
        </div>

        <div class="pure-u-1">
            <h2>Jitter: disposals per player</h2>
            <div id="jitter" class="chart"></div>
        </div>

        <div class="pure-u-1">
            <h2>Heatmap</h2>
            <div id="heatmap" class="chart"></div>
        </div>

    </div>
  </main>
</body>
</html>
